[project]
name = "v9-sidecar"
version = "0.1.0"
description = "Side-effect-free CLI wrapper around the V9 pump and selector-valve hardware, bundleable as a Tauri sidecar."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "loguru>=0.7.0",
    "pyinstaller>=6.21.0",
    # Required at runtime for the `vd` subcommand (XtalX D/V sensor). Imported
    # lazily inside vd_sensor.py so the rest of the CLI and the tests run
    # without it or the hardware present.
    "xtalx>=0.6.0",
    "libusb-package>=1.0.30.0",
    # Required at runtime for the `hc` subcommand (NI-DAQ voltage acquisition).
    # Imported lazily inside hc_measurement.DaqReader so the rest of the CLI and
    # the tests run without it or the hardware present.
    "nidaqmx>=0.9.0",
]

[project.scripts]
v9-sidecar = "cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
# Use the OS certificate store; this environment's default bundle fails PyPI TLS.
system-certs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
